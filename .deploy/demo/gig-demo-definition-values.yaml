elCicdDefs:
  GIG_MOD_DEMO: gig-mod-demo
  GIG_MOD_ASK_USER: gig-dif-ask-user
  GIG_MOD_SOURCE_DEMO: gig-mod-source-demo
  GIG_MOD_PRINT_MSG: gig-mod-print-msg-demo
  GIG_MOD_NAMES: [$<GIG_MOD_DEMO>, $<GIG_MOD_ASK_USER>, $<GIG_MOD_SOURCE_DEMO>, $<GIG_MOD_PRINT_MSG>]

  GIG_FORM_NAME: gig-demo-launchform

elCicdTemplates:
- apiVersion: batch.ahplos.org/v1beta1
  kind: GigForm
  objNames: [$<GIG_FORM_NAME>, $<GIG_FORM_NAME>]
  objName: $<GIG_FORM_NAME>-$<#>
  template:
    spec:
      title: Sign in as a cluster-admin for Gig Demonstration
      inputForm:
      - attributes:
          label: Cluster Admin User Name
        components:
          - inputType: TextInput
            booleans:
            - isRequired
        var: CLUSTER_ADMIN_USER_NAME
      - attributes:
          label: Cluster Admin Password
        components:
          - attributes:
              type: password
            booleans:
            - isRequired
            inputType: TextInput
        var: CLUSTER_ADMIN_PASSWORD
      - attributes:
          isInline: 'true'
          label: Visual Mode
          role: radiogroup
        components:
          - attributes:
              label: Graphical
            inputType: Radio
          - attributes:
              label: Logs
            booleans:
            - isChecked
            inputType: Radio
        var: RUN_DEBUG_MODE

- apiVersion: batch.ahplos.org/v1beta1
  kind: GigModule
  objNames: $<GIG_MOD_NAMES>
  elCicdDefs-$<GIG_MOD_DEMO>:
    GIG_MOD_SPECS:
      gigFormRef:
        name: $<GIG_FORM_NAME>-1
      requiredInputParams:
      - CLUSTER_ADMIN_USER_NAME
      - CLUSTER_ADMIN_PASSWORD
      secretVars:
      - CLUSTER_ADMIN_PASSWORD
      stages:
      - name: login
        description: Login into cluster as cluster admin, and retrieve Gig supported Step sourceTypes.
        steps:
        - name: cluster-admin-login.sh
          sourceCode: |-
            SOME_VAR='Testing scripts run in current process'
            oc login --insecure-skip-tls-verify -u ${CLUSTER_ADMIN_USER_NAME} -p ${CLUSTER_ADMIN_PASSWORD} https://kubernetes.default.svc
            sleep 2
      - name: retrieve-gig-supported-languages
        sourceRef:
          gigModuleRef:
            name: $<GIG_MOD_ASK_USER>
  elCicdDefs-$<GIG_MOD_ASK_USER>:
    GIG_MOD_SPECS:
      mode: Library
      stages:
      - name: choose-demo-source-types
        description: Have user choose which Gig supported sourceTypes to demo.
        steps:
        - name: retrieve-gig-operator-supported-languages
          sourceCode: |-
            echo "SOME_VAR: ${SOME_VAR}"
            JSON=$(oc get configmap ahplos-gigs-stage-processors -n gigs-operator -o jsonpath='{.data}')
            LANGS=$(echo "${JSON}" | jq -r 'keys[]' | paste -sd ',' - | sed -E -e 's/([A-Z][A-Za-z.-]+)/"\1"\ /g')
            echo "{%- set LANGS = [${LANGS}] %}" > tek_langs.j2
            sleep 2
        - name: ask-user-what-languages-to-demo.j2
          sourceType: Input
          sourceCode: |-
            {%- include 'tek_langs.j2' %}
            {%- from 'tek_langs.j2' import LANGS %}
            {%- for LANG in LANGS %}
            {% filter indent(width=4) %}
            - attributes:
                label: {{ LANG }}
              components:
                - inputType: Checkbox
              var: LANG_{{ LANG|upper }}
            {%- endfilter %}
            {%- endfor %}
      - name: execute-demo-source-types
        description: Demonstrate the chosen sourceTypes
        steps:
        - name: demonstrate-go
          sourceRef:
            gigModuleRef:
              name: $<GIG_MOD_SOURCE_DEMO>
            stage: demonstrate-go
          when: |-
            env.LANG_GO
        - name: demonstrate-python
          sourceRef:
            gigModuleRef:
              name: $<GIG_MOD_SOURCE_DEMO>
            stage: demonstrate-python
  elCicdDefs-$<GIG_MOD_SOURCE_DEMO>:
    GIG_MOD_SPECS:
      stages:
      - name: demonstrate-go
        description: Set a test msg with a Go sourceCode and print it.
        steps:
        - name: set-test-msg-with.go
          sourceType: Go
          sourceCode: |-
            package main

            import (
              "os"
            )

            func main() {
              var f, _ = os.OpenFile(".env", os.O_CREATE|os.O_APPEND|os.O_WRONLY, 0755)
              defer f.Close()
              f.WriteString("\nTEST_MSG='This test msg was set using Go'")
            }
        - name: print-the-go-msg
          sourceRef:
            gigModuleRef:
              name: $<GIG_MOD_PRINT_MSG>
            stage: print-the-demo-msg
            step: print-the-demo-msg
      - name: demonstrate-python
        description: Set a test msg with a Python sourceCode and print it.
        steps:
        - name: set-test-msg-with.py
          sourceType: Python
          sourceCode: |-
            with open('.env', 'a') as env_file:
              env_file.write("\nTEST_MSG='This test msg was set using Python'")
          when: |-
            env.LANG_PYTHON
        - name: print-the-python-msg
          sourceRef:
            gigModuleRef:
              name: $<GIG_MOD_PRINT_MSG>
            stage: print-the-demo-msg
            step: print-the-demo-msg
          when: |-
            env.LANG_PYTHON
  elCicdDefs-$<GIG_MOD_PRINT_MSG>:
    GIG_MOD_SPECS:
      stages:
      - name: print-the-demo-msg
        steps:
        - name: print-the-demo-msg
          when: |-
            env.LANG_PYTHON
          sourceCode: |-
            echo ${TEST_MSG}
  template:
    spec: $<GIG_MOD_SPECS>
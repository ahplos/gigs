elCicdDefs:
  GIG_DEF_NAME: gig-demo-gig-definition

elCicdTemplates:
- apiVersion: batch.teknetes.org/v1beta1
  kind: GigDefinition
  objName: $<GIG_DEF_NAME>
  template:
    spec:
      name: Gig Demo
      secrets:
      - envVar: CLUSTER_ADMIN_PASSWORD
      - secretRef:
          name: gig-demo-secrets
      form:
        spec:
        - attributes:
            label: Cluster Admin User Name
          components:
            - inputType: TextInput
              booleans:
              - isRequired
          var: CLUSTER_ADMIN_USER_NAME
        - attributes:
            label: Cluster Admin Password
          components:
            - attributes:
                type: password
              booleans:
              - isRequired
              inputType: TextInput
          var: CLUSTER_ADMIN_PASSWORD
        - attributes:
            isInline: 'true'
            label: Visual Mode
            role: radiogroup
          components:
            - attributes:
                label: Graphical
              inputType: Radio
            - attributes:
                label: Logs
              booleans:
              - isChecked
              inputType: Radio
          var: RUN_DEBUG_MODE
      stages:
        - description: Login into cluster as cluster admin
          displayName: Cluster Admin Authentication
          name: cluster-admin-login-to-cluster
          script: |-
            oc login --insecure-skip-tls-verify -u ${CLUSTER_ADMIN_USER_NAME} -p ${CLUSTER_ADMIN_PASSWORD} https://kubernetes.default.svc
            sleep 2
        - description: Retrieve Gig Operator supported Stage languages.
          name: retrieve-gig-operator-supported-languages
          script: |-
            JSON=$(oc get configmap teknetes-gigs-stage-processors -n gigs-operator -o jsonpath='{.data}')
            LANGS=$(echo "${JSON}" | jq -r 'keys[]' | tr '\n' ',' | sed -E -e 's/([A-Za-z]+)/"\1"\ /g')
            echo "{%- set LANGS = [${LANGS}] %}" > tek_langs.j2
            sleep 2
        - description: Ask the user what Teknetes Gig language support they wish demonstrated.
          displayName: Which languages should be demoed?
          name: ask-user-what-languages-to-demo.j2
          processor: Input
          script: |-
            {%- include 'tek_langs.j2' %}
            {%- from 'tek_langs.j2' import LANGS %}
            {%- for LANG in LANGS %}
            {% filter indent(width=4) %}
            - attributes:
                label: {{ LANG }}
              components:
                - inputType: Checkbox
              var: LANG_{{ LANG|upper }}
            {%- endfilter %}
            {%- endfor %}
        - description: Print languages selected
          name: test-stage-four.go
          script: |-
            for LANG_APPROVED in $(compgen -v | grep 'LANG_.*_EXECUTE')
            do
              echo "LANGUAGE TO EXECUTE: ${LANG_APPROVED}"
            done
        - description: Set a test msg with a Go script.
          name: test-stage-four.go
          processor: Go
          script: |-
            package main

            import (
              "os"
            )

            func main() {
              var f, _ = os.OpenFile(".env", os.O_CREATE|os.O_APPEND|os.O_WRONLY, 0755)
              defer f.Close()
              f.WriteString("\nTEST_MSG='This value was set in Stage Four with Go'")
            }
        - description: Print the test msg from stage four.
          displayName: Test Stage Five
          name: test-stage-five
          processor: Shell
          script: |-
            echo ${TEST_MSG}
        - description: Prove the secrets are filtered.
          displayName: Test Stage Six
          name: test-stage-six
          processor: Shell
          script: |-
            echo 'The secrets for this Gig are:'
            echo "    CLUSTER_ADMIN_USER_NAME: ${CLUSTER_ADMIN_PASSWORD}"
            echo "    CLUSTER_ADMIN_PASSWORD: ${CLUSTER_ADMIN_PASSWORD}"
            echo "    ANOTHER_SECRET: ${ANOTHER_SECRET}"
            echo "    FIRST_SECRET: ${FIRST_SECRET}"
            echo "    SECOND_SECRET: ${SECOND_SECRET}"
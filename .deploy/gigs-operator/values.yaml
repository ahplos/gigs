elcicd-chart:
  elCicdDefs:
    PLUGIN_NAME: ahplos-gigs-console-plugin
    OPERATOR_NAME: ahplos-gigs-operator
    GIG_HOOKS_HANDLER: gighooks

    IMAGE_REGISTRY: dev-demo-image-registry.apps-crc.testing
    GIGS_PLUGIN_IMAGE: $<IMAGE_REGISTRY>/$<PLUGIN_NAME>:latest
    GIGS_OPERATOR_IMAGE: $<IMAGE_REGISTRY>/$<OPERATOR_NAME>:latest

    GIGS_IMAGE_PULL_SECRET: gig-registry-credentials

    PORT: 8443

    IMAGE_PULL_POLICY: Always

    NGINX_CONF_VOLUME: nginx-conf
    NGINX_CONF: nginx.conf

    PATCH_SA_NAME: console-patcher

    CERT_NAME: $<HELM_RELEASE_NAME>-cert

    GIGS_ADMIN_ROLE: gigs-admin

    GIGS_OCP_OPERATOR_ROLE: $<OPERATOR_NAME>-openshift-console

    GIGS_DEFAULT_RUNTIMES: default-runtimes

  elCicdDefs-dev:
    IMAGE_PULL_POLICY: Always

  elCicdTemplates:
  - templateNames: [deployment, service]
    objName: $<OPERATOR_NAME>
    port: $<PORT>
    image: $<GIGS_OPERATOR_IMAGE>
    imagePullSecrets:
    - name: $<GIGS_IMAGE_PULL_SECRET>
    imagePullPolicy: $<IMAGE_PULL_POLICY>
    strategy:
      type: Recreate
    serviceAccountName: $<OPERATOR_NAME>
    workDir: /gigs-controller
    command:
    - bash
    - -c
    - |-
      set -ex
      python --version
      python ./utilities/console_patch.py $<PLUGIN_NAME>
      kopf run --all-namespaces --verbose $(ls *_controller.py)
    env:
    - name: GIGS_OPERATOR_NAMESPACE
      valueFrom:
        fieldRef:
          fieldPath: metadata.namespace
    - name: GIGS_OPERATOR_NAME
      value: $<OPERATOR_NAME>
    - name: GIGS_OPERATOR_PORT
      value: $<toString|PORT>
    - name: GIGS_DEFAULT_RUNTIMES
      value: $<GIGS_DEFAULT_RUNTIMES>
    volumeMounts:
    - name: $<CERT_NAME>
      readOnly: true
      mountPath: /var/cert
    volumes:
    - name: $<CERT_NAME>
      secret:
        secretName: $<CERT_NAME>
        defaultMode: 0420


  - templateNames: [deployment, service, ingress]
    objName: $<GIG_HOOKS_HANDLER>-handler
    mustHaveAnyProfile:
    - webhooks-enabled
    port: $<PORT>
    host: $<GIG_HOOKS_HANDLER>.$<CLUSTER_DOMAIN>
    path: /
    image: $<GIGS_OPERATOR_IMAGE>
    imagePullSecrets:
    - name: $<GIGS_IMAGE_PULL_SECRET>
    imagePullPolicy: $<IMAGE_PULL_POLICY>
    serviceAccountName: $<OPERATOR_NAME>
    workDir: /gigs-controller
    command:
    - bash
    - -c
    - |-
      set -ex
      python --version
      python gighook_handler.py $<toString|PORT>

  - templateNames: [deployment, service, serviceAccount]
    annotations:
      service.beta.openshift.io/serving-cert-secret-name: $<CERT_NAME>
    objName: $<PLUGIN_NAME>
    replicas: 2
    port: $<PORT>
    image: $<GIGS_PLUGIN_IMAGE>
    imagePullSecrets:
    - name: $<GIGS_IMAGE_PULL_SECRET>
    imagePullPolicy: $<IMAGE_PULL_POLICY>
    serviceAccountName: $<OBJ_NAME>
    command:
    - bash
    - -c
    - |-
      if echo "$POD_IP" | grep -qE '^([0-9]{1,3}\.){3}[0-9]{1,3}$'; then
          LISTEN_ADDRESS_PORT_REPLACED_AT_RUNTIME="$<toString|PORT>"
      else
          LISTEN_ADDRESS_PORT_REPLACED_AT_RUNTIME="[::]:$<toString|PORT>"
      fi
      sed "s/LISTEN_ADDRESS_PORT_REPLACED_AT_RUNTIME/$LISTEN_ADDRESS_PORT_REPLACED_AT_RUNTIME/g" /etc/nginx/$<NGINX_CONF> >/tmp/$<NGINX_CONF>

      nginx -c /tmp/$<NGINX_CONF> -g 'daemon off;'
    env:
    - name: POD_IP
      valueFrom:
        fieldRef:
          fieldPath: status.podIP
    strategy:
      type: RollingUpdate
      rollingUpdate:
        maxUnavailable: 25%
        maxSurge: 25%
    volumeMounts:
      - name: $<CERT_NAME>
        readOnly: true
        mountPath: /var/cert
      - name: $<NGINX_CONF_VOLUME>
        readOnly: true
        mountPath: /etc/nginx/$<NGINX_CONF>
        subPath: $<NGINX_CONF>
    volumes:
      - name: $<CERT_NAME>
        secret:
          secretName: $<CERT_NAME>
          defaultMode: 0420
      - name: $<NGINX_CONF_VOLUME>
        configMap:
          name: $<NGINX_CONF>
          defaultMode: 0420
          items:
          - key: $<NGINX_CONF>
            path: $<NGINX_CONF>

  - templateName: configMap
    objName: $<NGINX_CONF>
    data:
      $<NGINX_CONF>: |-
        error_log /dev/stdout info;
        events {}
        http {
          access_log         /dev/stdout;
          include            /etc/nginx/mime.types;
          default_type       application/octet-stream;
          keepalive_timeout  65;
          server {
            listen              LISTEN_ADDRESS_PORT_REPLACED_AT_RUNTIME ssl;
            ssl_certificate     /var/cert/tls.crt;
            ssl_certificate_key /var/cert/tls.key;
            root                /usr/share/nginx/html;
          }
        }
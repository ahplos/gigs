elCicdDefs:
  GIG: gig
  GIG_FORM: $<GIG>form
  GIG_HOOK: $<GIG>hook
  GIG_MODULE: $<GIG>module
  GIG_RUN: $<GIG>run
  GIG_TYPES: [$<GIG_MODULE>, $<GIG_FORM>, $<GIG_HOOK>, $<GIG>, $<GIG_RUN>]

  STAGE_STEP_PATTERN: '[a-z]+(?:-[a-z0-9]+)*'

  NAME_NAMESPACE_PROPS:
    name:
      type: string
    namespace:
      type: string

  STEP_REF:
    type: object
    description: |-
      Reference to another Step in a Stage in a GigModuleto be processed where referenced.  When clauses in the
      referenced Step are ignored.
    required:
    - gigModuleRef
    - stage
    - name
    properties:
      gigModuleRef: $<GIG_MODULE_REF>
      name:
        type: string
        pattern: $<STAGE_STEP_PATTERN>
      stage:
        type: string
        pattern: $<STAGE_STEP_PATTERN>

  RUN_STATE:
    type: string
    enum:
    - Aborted
    - Aborting
    - Failed
    - InputReceived
    - Running
    - Succeeded
    - WaitingForInput
    default: Running

  MODE_SPEC:
    type: string
    enum:
    - Executable
    - Library
    default: Executable

  GIG_FORM_REF:
    type: object
    description: Reference to a GigForm.
    properties: $<NAME_NAMESPACE_PROPS>
    required:
    - name

  GIG_MODULE_REF:
    type: object
    description: Reference to a GigModule.
    properties: $<NAME_NAMESPACE_PROPS>
    required:
    - name

  TITLE_SPEC:
    type: object
    properties:
      title:
        type: string
      headingLevel:
        type: string
        enum:
        - h1
        - h2
        - h3
        - h4
        - h5
        - h6
        default: h2

  FORM_SPEC:
    type: array
    description: |-
      Optional list of groups of components organized into sections of a form users will use to  a job.
    x-kubernetes-list-type: map
    x-kubernetes-list-map-keys:
    - var
    items:
      type: object
      required:
      - inputType
      - var
      properties:
        attributes:
          type: object
          description: |-
            General attributes for form component(s).  Only the label is required.
          properties:
            defaultValue:
              type: string
              description: |-
                The default value of the input item.  For numbered or boolean components, use the corresponding string value; e.g. 'true' vs true.
            isChecked:
              type: boolean
              description: |-
                If true and a checkbox, the checkbox will be created as already selected.
            isInline:
              type: boolean
              description: |-
                If true, multiple components will be displayed horizontally.  Only useful if defined a radioGroup.
            isRequired:
              type: boolean
              description: |-
                If true, the component must have a value entered by the user before the form can be submitted.
            label:
              type: string
              description: |-
                Descriptive label to be displayed above the component(s).
            labelInfo:
              type: string
              description: |-
                Additional label information displayed after the label.
            max:
              type: integer
              description: |-
                If the component represents a number, the maximum value to be valid; for dates, the latest date.
            maxLength:
              type: integer
              description: |-
                For text components, the maximum length of text to be valid.
            min:
              type: integer
              description: |-
                If the component represents a number, the minimum value to be valid; for dates, the earliest date.
            minLength:
              type: integer
              description: |-
                For text components, the minimum length of text for the input to be valid.
            options:
              type: array
              description: |-
                For Select, RadioGroup, and CheckboxGroup components, a list a strings representing choices for the user to select.
                For RadioGroup and Select components this corresponds to the possible values, too.
              items:
                type: string
              x-kubernetes-list-type: set
            pattern:
              type: string
              description: |-
                An optional regular expression for the value of the input to be validated against.
            placeholder:
              type: string
              description: |-
                For text based components, placeholder of the text input when there is no value.
            style:
              type: object
              description: |-
                Basic CSS styling can be defined here; e.g. maxWidth: 500px.
              x-kubernetes-preserve-unknown-fields: true
            type:
              type: string
              description: |-
                For Text component only, configures the typeof input.  Can be 'text', 'date', 'datetime-local', 'email', 'month',
                'number', 'password', 'search', 'tel', 'time', or 'url'.
              enum: ["text", "date", "datetime-local", "email", "month", "number", "password", "search", "tel", "time", or "url"]
        helperText:
          type: string
          description: |-
            Short, descriptive help that will be displayed under the component(s) for users.
        inputType:
          type: string
          description: |-
            The type of component(s) to display.  May be either:
            - Checkbox
            - CheckboxGroup
            - RadioGroup
            - Select
            - Text
            - TextArea
          enum:
          - Checkbox
          - CheckboxGroup
          - RadioGroup
          - Select
          - Text
          - TextArea
        var:
          type: string
          description: |-
            Variable that will be assigned from the value of component(s) in the group.
          pattern: '^\w+$'

elCicdDefs-$<GIG_FORM>:
  TITLE_CASE_NAME: GigForm
  SHORT_NAMES:
  - $<GIG_FORM>
  - $<GIG_FORM>s
  SPEC_DEFINITION:
    type: object
    description: |-
      $<TITLE_CASE_NAME>Spec defines a $<TITLE_CASE_NAME>, and the optional and/or required inputValues to  it.
    required:
    - inputForm
    properties:
      formTitle: $<TITLE_SPEC>
      inputForm: $<FORM_SPEC>

elCicdDefs-$<GIG_MODULE>:
  TITLE_CASE_NAME: GigModule
  SHORT_NAMES:
  - $<GIG_MODULE>
  - $<GIG_MODULE>s
  ITERATE_SPEC:
    type: object
    properties:
      loops:
        type: array
        description: One or more for loops.
        items:
          type: object
          properties:
            name:
              type: string
            envVar:
              type: object
              description: Environment variable with values separated by a delimeter.  The default delimeter is whitespace.
              properties:
                name:
                  type: string
                delim:
                  type: string
            range:
              type: object
              description: A range of numbers to iterate over, incremented each loop by the incr.
              properties:
                first:
                  x-kubernetes-int-or-string: true
                  default: 0
                last:
                  x-kubernetes-int-or-string: true
                incr:
                  x-kubernetes-int-or-string: true
                  default: 1
              required:
              - last
            vector:
              type: array
              description: A list of strings and/or integers to iterate over.
              items:
                x-kubernetes-int-or-string: true
              minLength: 1
            when:
              type: string
          anyOne:
          - required:
            - envVar
          - required:
            - range
          - required:
            - values
          required:
          - name
    required:
    - loops
  SPEC_DEFINITION:
    type: object
    description: |-
      $<TITLE_CASE_NAME>Spec defines a $<TITLE_CASE_NAME>, and the optional and/or required inputValues to  it.
    required:
    - activeDeadlineSeconds
    - stages
    - workDirSizeLimit
    properties:
      activeDeadlineSeconds:
        type: integer
        description: |-
          Time in seconds before a GigRun will be terminated. This value will override any value set in an associated CronJob.
        default: 600
      description:
        type: string
      gigFormRef: $<GIG_FORM_REF>
      inputParams:
        type: array
        description: |-
          List of input params used by the module.  This list has no functional value and is not verified. Use it for
          documentation purposes only.
        items:
          type: string
        x-kubernetes-list-type: set
      mode: $<MODE_SPEC>
      requiredInputParams:
        type: array
        description: |-
          List of required input parameters that are required to  to module.  A Secret with the same name as the GigRun
          will be checked for existence and that the required params are defined before ing.
        items:
          type: string
          pattern: '^[a-zA-Z_](\w+)$'
        x-kubernetes-list-type: set
      secretVars:
        type: array
        description: |-
          List of environment variables that are secrets and should be obfuscated in GigRun logs.
        items:
          type: string
        x-kubernetes-list-type: set
      stages:
        type: array
        description: |-
          List of stages. Stages are a comprised of a list of Steps.  Can be referenced from other GigModules.
        x-kubernetes-list-type: map
        x-kubernetes-list-map-keys:
        - name
        items:
          type: object
          required:
          - name
          oneOf:
          - required:
            - stageRef
          - required:
            - steps
          properties:
            description:
              type: string
            iterate: $<ITERATE_SPEC>
            maxParallel:
              type: integer
              description: |-
                Number of maximum background processes the stage should run in.  If greater than 0, then stage will spawn
                in the background up the to number given; e.g. if the stage is iterated over 5 times, but maxParallel
                is 3, at most 3 active stages will execute simultaneously until all 5 are run.
            mode: $<MODE_SPEC>
            name:
              type: string
              pattern: $<STAGE_STEP_PATTERN>
            private:
              type: boolean
            secretVars:
              type: array
              description: |-
                A list of environment variables that should be obfuscated in the logs. These will be added to the Gig secrets.
              items:
                type: string
              x-kubernetes-list-type: set
            stageRef:
              type: object
              description: |-
                Reference to another Stage in a GigModule to be processed where referenced.  When clauses in the
                referenced Stage are ignored.
              required:
              - gigModuleRef
              properties:
                gigModuleRef: $<GIG_MODULE_REF>
                name:
                  type: string
                  pattern: $<STAGE_STEP_PATTERN>
            wait:
              type: boolean
            when:
              type: string
              description: |-
                Javascript statement that must evaluate to `true` for the stage to be processed. For ease of writing expressions,
                environment variables are copied into the `env` Javascript object; e.g. FOO='some value' in shell can be refered
                to as `env.FOO` in the statements.
            workDir:
              type: string
            steps:
              type: array
              description: |-
                List of Steps within a Stage.  Steps define a unit of work within a Stage. Can be referenced by name in other Stages.
              x-kubernetes-list-type: map
              x-kubernetes-list-map-keys:
              - name
              items:
                type: object
                required:
                - name
                oneOf:
                - required:
                  - stepRef
                - required:
                  - sourceCode
                properties:
                  command:
                    type: string
                    descriptions: |-
                      Command used to process the sourceCode. The 'command' is defined by the 'interpreter' and set by the Gigs controller
                      unless the 'interpreter' is set to 'Custom'.
                  args:
                    type: array
                    description: Extra arguments to be passed to each step's command.  Ignored when the step is referenced.
                    items:
                      type: string
                  defaultArgs:
                    type: array
                    description: Extra arguments always passed to each step's command.
                    items:
                      type: string
                  description:
                    type: string
                    description: Description of name's purpose.
                  interpreter:
                    type: string
                    description: |-
                      The file type for the step. Files are mounted as files in the Pod and executed using the declared file type's interpreter;
                      i.e. in a subprocess. The 'Shell' (Bash .sh) file type is the default.
                    enum:
                    - Custom
                    - GigRun
                    - Go
                    - JavaScript
                    - Python
                    - Shell
                    - Template
                    - UserInput
                    default: Shell
                  iterate: $<ITERATE_SPEC>
                  maxParallel:
                    type: integer
                    description: |-
                      Number of maximum background processes the step should run in.  If greater than 0, then step will spawn
                      in the background up the to number given; e.g. if the step is iterated over 5 times, but maxParallel
                      is 3, at most 3 active steps will execute simultaneously until all 5 are run.
                  name:
                    type: string
                    description: |-
                      Name of the step. Must start and end with an alphanumeric character, and '-' and '.' may be used.
                      The name will reflect the name of the file used to store the sourceCode, so name appropiately;
                      e.g. <some-name>.py if the name is a Python sourceCode.
                    pattern: $<STAGE_STEP_PATTERN>
                  outputFile:
                    type: object
                    description: |-
                      If the interpreter is TemplateFile and outputFile is defined, the output of the template will be saved
                      to the given path.  If not defined, the file will be named after the step and saved in the current
                      working directory.
                    required:
                    - path
                    properties:
                      path:
                        type: string
                        description: Path relative to current working directory
                      append:
                        type: boolean
                        description: Whether the file should be appended to or overwritten. Default is to overwrite.
                  private:
                    type: boolean
                  secretVars:
                    type: array
                    description: |-
                      A list of environment variables that should be obfuscated in the logs. These will be set for stage only.
                    items:
                      type: string
                    x-kubernetes-list-type: set
                  sourceCode:
                    type: string
                    description: |-
                      The sourceCode to execute. Can be writting in any language or template file supported by Ahplos Gigs,
                      or as a sourceCode for a custom command to run.  Will take precedence over sourceFile.
                  sourceFile:
                    type: string
                    description: |-
                      Path to file relative to the current working directory to process per the interpreter.
                  stepRef: $<STEP_REF>
                  templateType:
                    type: string
                    enum:
                    - Go
                    - Helm
                    - JavaScriptLiteral
                    - Jinja
                  wait:
                    type: boolean
                  when:
                    type: string
                    description: |-
                      Javascript statement that must evaluate to `true` for the step to be processed. For ease of writing expressions,
                      environment variables are copied into the `env` Javascript object; e.g. FOO='some value' in shell can be refered
                      to as `env.FOO` in the statements.
                  workDir:
                    type: string
                    description: Working directory of current step.
      workDirSizeLimit:
        pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
        x-kubernetes-int-or-string: true
        default: 100Mi

elCicdDefs-$<GIG>:
  TITLE_CASE_NAME: Gig
  SHORT_NAMES:
  - $<GIG>
  - $<GIG>s
  SPEC_DEFINITION:
    type: object
    description: |-
      $<TITLE_CASE_NAME>Spec defines a $<TITLE_CASE_NAME>. $<TITLE_CASE_NAME>s represent the relationship between a
      GigModule, CronJob, and GigForm.
    properties:
      cronJobRef:
        type: object
        description: Reference to a CronJob in the same Namespace as the Gig.
        properties:
          name:
            type: string
            description: Name of a CronJob in the same Namespace as the Gig.
        required:
        - name
      gigModuleRef:
        type: object
        description: Reference to a GigModule.
        properties: $<NAME_NAMESPACE_PROPS>
        required:
        - name
      gigFormRef: $<GIG_FORM_REF>

    required:
    - cronJobRef
    - gigModuleRef
  STATUS_DEFINITION:
    type: object
    properties:
      latestGigRun:
        type: object
        properties:
          creationTimestamp:
            type: string
          name:
            type: string
          runState: $<RUN_STATE>
          runTime:
            type: integer
          startedBy:
            type: string

elCicdDefs-$<GIG_RUN>:
  TITLE_CASE_NAME: GigRun
  SHORT_NAMES:
  - $<GIG_RUN>
  - $<GIG_RUN>s
  SPEC_DEFINITION:
    type: object
    description: |-
      $<TITLE_CASE_NAME>Spec defines a $<TITLE_CASE_NAME>, which in turn trigger a Job produced from the parent Gig's CronJob.
    properties:
      gigRef:
        type: object
        required:
        - name
        properties:
          name:
            type: string
            x-kubernetes-validations:
            - rule: "!(self != oldSelf)"
              message: gigRef is immutable
      formTitle: $<TITLE_SPEC>
      inputForm: $<FORM_SPEC>
      inputReceived:
        type: boolean
        default: false
      inputValues:
        type: string
        description: |-
          JSON string of input values to pass to a runner Pod when starting a GigRun, or to resume execution when paused for further input.
          InputValues are never preserved in a deployed GigRun, but rather used by the Gig Operator to create an associated Secret for
          the Pod to read and use.  The Secret will contain the JSON string of all inputValues, each subsequent update will be merged with
          any existing values for the life of the GigRun, and the JSON string all will be injected into an environment variable in the runner
          as GIG_RUN_INPUT.
      runState: $<RUN_STATE>
      startedBy:
        type: string
        description: |-
          User or ServiceAccount that created the GigRun.
        x-kubernetes-validations:
        - rule: "size(oldSelf) > 0 && !(self != oldSelf)"
          message: startedBy is immutable
    required:
    - gigRef
  STATUS_DEFINITION:
    type: object
    properties:
      runTime:
        type: integer
        description: |-
          Time in seconds it took to complete processing the GigRun.

elCicdDefs-$<GIG_HOOK>:
  TITLE_CASE_NAME: GigHook
  SHORT_NAMES:
  - $<GIG_HOOK>
  - $<GIG_HOOK>s
  SPEC_DEFINITION:
    type: object
    description: |-
      $<TITLE_CASE_NAME>Spec defines a $<TITLE_CASE_NAME>. A $<TITLE_CASE_NAME> defines a trigger
      from external sources for a $<GIG>.  $<GIG_HOOK>s must exist in the same namespace and have
      the same name as the $<GIG> they intend to trigger.
    properties:
      isEnabled:
        type: boolean
        default: true
      eventData:
        type: array
        description: |-
          List of values to expected in hook.  Used to defined expected values and/or whether
          they are to be passed onto the $<GIG_RUN> if it hook passes validation.
        items:
          type: object
          x-kubernetes-validations:
          - rule: "has(self.inputVar) || has(self.validation)"
            message: "You must define a mapping to a $<GIG_RUN> inputVar and/or a validation for each listing"
          required:
          - key
          - source
          properties:
            key:
              type: string
              description: |-
                The key of the incoming request.  Headers and query strings are treated as literals.  Payload keys
                are treated as JSON paths.
            inputVar:
              type: string
              description:
                Name of variable to pass the value from the hook event to the $<GIG_RUN>. If values need further processing,
                that logic belongs inside a GigModule.
            source:
              type: string
              description: |-
                Where to look for the key in the POST to extract the value.
              enum:
              - Header
              - Payload
              - QueryString
              default: Header
            validation:
              type: object
              x-kubernetes-validations:
              oneOf:
                - required: ["bool"]
                - required: ["match"]
                - required: ["secretKeyRef"]
              properties:
                bool:
                  type: boolean
                match:
                  type: string
                  description:
                    Regular expression or HMAC key to validate against the incoming value.
                secretKeyRef:
                  type: object
                  description:
                    Regular expression or HMAC key in Secret to validate against the incoming value.
                  properties:
                    name:
                      type: string
                    key:
                      type: string
                type:
                  type: string
                  description: |
                    Determines how non-boolean matches are performed against the incoming value. Regex will
                    match against a regular expression, and HMAC compare the incoming value against the HMAC
                    hash based on the payload and the given key.
                  enum:
                  - Regex
                  - HMAC

elCicdTemplates:
- apiVersion: apiextensions.k8s.io/v1
  kind: CustomResourceDefinition
  objNames: $<GIG_TYPES>
  objName: $<>s.batch.ahplos.org
  template:
    spec:
      conversion:
        strategy: None
      group: batch.ahplos.org
      names:
        kind: $<TITLE_CASE_NAME>
        plural: $<BASE_OBJ_NAME>s
        singular: $<BASE_OBJ_NAME>
        shortNames: $<SHORT_NAMES>
      scope: Namespaced
      preserveUnknownFields: false
      versions:
      - name: v1beta1
        served: true
        storage: true
        subresources:
          status: {}
        schema:
          openAPIV3Schema:
            type: object
            properties:
              apiVersion:
                type: string
                description: |-
                  APIVersion defines the versioned module of this representation of an object.
                  Servers should convert recognized schemas to the latest internal value, and
                  may reject unrecognized values.
                  More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
              kind:
                type: string
                description: |-
                  Kind is a string value representing the REST resource this object represents.
                  Servers may infer this from the endpoint the client submits requests to.
                  Cannot be updated.
                  In CamelCase.
                  More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
              metadata:
                type: object
              spec: $<SPEC_DEFINITION>
              status: $<STATUS_DEFINITION>
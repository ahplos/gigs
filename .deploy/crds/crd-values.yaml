elCicdDefs:
  GIG: gig
  GIG_FORM: $<GIG>form
  GIG_MODULE: $<GIG>module
  GIG_RUN: $<GIG>run
  GIG_TYPES: [$<GIG_MODULE>, $<GIG_FORM>, $<GIG>, $<GIG_RUN>]

  STAGE_STEP_PATTERN: '[a-z]+(?:-[a-z0-9]+)*'

  NAME_NAMESPACE_PROPS:
    name:
      type: string
    namespace:
      type: string

  RUN_STATE:
    type: string
    enum:
    - Aborted
    - Aborting
    - Failed
    - InputReceived
    - Running
    - Succeeded
    - WaitingForInput
    default: Running

  MODE_SPEC:
    type: string
    enum:
    - Executable
    - Library
    default: Executable

  GIG_FORM_REF:
    type: object
    description: Reference to a GigForm.
    properties: $<NAME_NAMESPACE_PROPS>
    required:
    - name

  GIG_MODULE_REF:
    type: object
    description: Reference to a GigModule.
    properties: $<NAME_NAMESPACE_PROPS>
    required:
    - name

  TITLE_SPEC:
    type: object
    properties:
      title:
        type: string
      headingLevel:
        type: string
        enum:
        - h1
        - h2
        - h3
        - h4
        - h5
        - h6
        default: h2

  FORM_SPEC:
    type: array
    description: |
      Optional list of groups of components organized into sections of a form users will use to  a job.
    x-kubernetes-list-type: map
    x-kubernetes-list-map-keys:
    - var
    items:
      type: object
      required:
      - components
      - var
      properties:
        attributes:
          type: object
          description: |-
            A map of key/value pairs that optionally configure a group of components.
          additionalProperties:
            type: string
        booleans:
          type: array
          description: |-
            String only attributes for configuring a component; e.g. isVisible (vs isVisible="true").
          items:
            type: string
          x-kubernetes-list-type: set
        components:
          type: array
          items:
            type: object
            description: |-
              Arbitrary keys corresponding to JSX PatternFly Form (e.g. TextInput or Radio) controls that contain a map of zero or more
              attributes for the control; e.g.
                - component: Radio
                  attributes:
                    label: Option 1
            properties:
              attributes:
                type: object
                description: |-
                  Attributes are a map of {key,value} pairs for configuring a component.
                additionalProperties:
                  x-kubernetes-int-or-string: true
              booleans:
                type: array
                description: |-
                  String only attributes for configuring a component; isVisible (vs isVisible="true").
                items:
                  type: string
                x-kubernetes-list-type: set
              inputType:
                type: string
                enum:
                - Checkbox
                - Dropdown
                - NumberInput
                - Radio
                - TextArea
                - TextInput
            required:
            - inputType
        helperText:
          type: string
          description: |-
            Short, descriptive help that will be displayed alongside component(s) for users.
        var:
          type: string
          description: |-
            Variable that will be assigned from the value of component(s) in the group.
          pattern: '^\w+$'
        defaultValue:
          x-kubernetes-preserve-unknown-fields: true
          type: object
          description: |-
            Should hold a single key/value pair of "var: <value>"; e.g. given var's value is MY_INPUT_VAR, then MY_INPUT_VAR: myDefaultValue.
            The values can be any valid YAML value.  All other additional fields will be ignored.

elCicdDefs-$<GIG_FORM>:
  TITLE_CASE_NAME: GigForm
  SHORT_NAMES:
  - gigform
  - gigforms
  SPEC_DEFINITION:
    type: object
    description: |
      $<TITLE_CASE_NAME>Spec defines a GigForm, and the optional and/or required inputValues to  it.
    required:
    - inputForm
    properties:
      formTitle: $<TITLE_SPEC>
      inputForm: $<FORM_SPEC>

elCicdDefs-$<GIG_MODULE>:
  TITLE_CASE_NAME: GigModule
  SHORT_NAMES:
  - gigmod
  - gigmods
  ITERATE_SPEC:
    type: object
    properties:
      when:
        type: string
      loops:
        type: array
        description: One or more for loops.
        items:
          type: object
          properties:
            name:
              type: string
            envVar:
              type: object
              description: Environment variable with values separated by a delimeter.  The default delimeter is space(s).
              properties:
                name:
                  type: string
                delim:
                  type: string
            range:
              type: object
              description: A range of numbers to iterate over, incremented each loop by the incr.
              properties:
                first:
                  x-kubernetes-int-or-string: true
                  default: 0
                last:
                  x-kubernetes-int-or-string: true
                incr:
                  x-kubernetes-int-or-string: true
                  default: 1
              required:
              - last
            vector:
              type: array
              description: A list of strings and/or integers to iterate over.
              items:
                x-kubernetes-int-or-string: true
              minLength: 1
          anyOne:
          - required:
            - envVar
          - required:
            - range
          - required:
            - values
          required:
          - name
    required:
    - loops
  SPEC_DEFINITION:
    type: object
    description: |
      $<TITLE_CASE_NAME>Spec defines a GigModule, and the optional and/or required inputValues to  it.
    required:
    - activeDeadlineSeconds
    - stages
    - workDirSizeLimit
    properties:
      activeDeadlineSeconds:
        type: integer
        description: |
          Time in seconds before a GigRun will be terminated. This value will override any value set in an associated CronJob.
        default: 600
      description:
        type: string
      gigFormRef: $<GIG_FORM_REF>
      inputParams:
        type: array
        description: |
          List of input params used by the module.  This list has no functional value and is not verified. Use it for
          documentation purposes only.
        items:
          type: string
        x-kubernetes-list-type: set
      mode: $<MODE_SPEC>
      requiredInputParams:
        type: array
        description: |
          List of required input parameters that are required to  to module.  A Secret with the same name as the GigRun
          will be checked for existence and that the required params are defined before ing.
        items:
          type: string
          pattern: '^[a-zA-Z_](\w+)$'
        x-kubernetes-list-type: set
      secretVars:
        type: array
        description: |
          List of environment variables that are secrets and should be obfuscated in GigRun logs.
        items:
          type: string
        x-kubernetes-list-type: set
      stages:
        type: array
        description: |
          List of stages. Stages are a comprised of a list of Steps.  Can be referenced from other GigModules.
        x-kubernetes-list-type: map
        x-kubernetes-list-map-keys:
        - name
        items:
          type: object
          required:
          - name
          oneOf:
          - required:
            - stageRef
          - required:
            - steps
          properties:
            description:
              type: string
            iterate: $<ITERATE_SPEC>
            maxParallel:
              type: integer
              description: |
                Number of maximum background processes the stage should run in.  If greater than 0, then stage will spawn
                in the background up the to number given; e.g. if the stage is iterated over 5 times, but maxParallel
                is 3, at most 3 active stages will execute simultaneously until all 5 are run.
            mode: $<MODE_SPEC>
            name:
              type: string
              pattern: $<STAGE_STEP_PATTERN>
            stageRef:
              type: object
              description: |
                Reference to another Stage in a GigModule to be processed where referenced.  When clauses in the
                referenced Stage are ignored.
              required:
              - gigModuleRef
              properties:
                gigModuleRef: $<GIG_MODULE_REF>
                name:
                  type: string
                  pattern: $<STAGE_STEP_PATTERN>
            wait:
              type: boolean
            when:
              type: string
              description: |
                Javascript statement that must evaluate to `true` for the stage to be processed. For ease of writing expressions,
                environment variables are copied into the `env` Javascript object; e.g. FOO='some value' in shell can be refered
                to as `env.FOO` in the statements.
            interationWhen:
              type: string
              description: |
                Javascript statement that must evaluate to `true` for the step to be processed. For ease of writing expressions,
                environment variables are copied into the `env` Javascript object; e.g. FOO='some value' in shell can be refered
                to as `env.FOO` in the statements. Only evaluated if iterate are defined, and evaluated each time just before
                the step is processed.
            workDir:
              type: string
            steps:
              type: array
              description: |
                List of Steps within a Stage.  Steps define a unit of work within a Stage. Can be referenced by name in other Stages.
              x-kubernetes-list-type: map
              x-kubernetes-list-map-keys:
              - name
              items:
                type: object
                required:
                - name
                oneOf:
                - required:
                  - stepRef
                - required:
                  - sourceCode
                properties:
                  command:
                    type: string
                    descriptions: |
                      Command used to process the sourceCode. The 'command' is defined by the 'interpreter' and set by the gigs controller
                      unless the 'interpreter' is set to 'Custom'.
                  args:
                    type: string
                    description: Extra arguments to be passed to each step's command.
                  description:
                    type: string
                    description: Description of name's purpose.
                  interpreter:
                    type: string
                    description: |
                      The interpretor for the step, either a module type or language. Scripts are mounted as files in the Pod and executed
                      using the declared interpreter; i.e. in a subprocess. The 'Shell' (Bash) interpreter is the default.
                    enum:
                    - Custom
                    - GigModule
                    - Go
                    - Input
                    - JinjaTemplate
                    - Python
                    - Shell
                    default: Shell
                  iterate: $<ITERATE_SPEC>
                  maxParallel:
                    type: integer
                    description: |
                      Number of maximum background processes the step should run in.  If greater than 0, then step will spawn
                      in the background up the to number given; e.g. if the step is iterated over 5 times, but maxParallel
                      is 3, at most 3 active steps will execute simultaneously until all 5 are run.
                  name:
                    type: string
                    description: |
                      Name of the step. Must start and end with an alphanumeric character, and '-' and '.' may be used.
                      The name will reflect the name of the file used to store the sourceCode, so name appropiately;
                      e.g. <some-name>.py if the name is a Python sourceCode.
                    pattern: $<STAGE_STEP_PATTERN>
                  sourceCode:
                    type: string
                    description: |
                      The sourceCode to execute. Can be writting in any language or module type supported by Ahplos Gigs,
                      or as a sourceCode for a custom command to run.  Can alse refer to another GigModule.
                  stepRef:
                    type: object
                    description: |
                      Reference to another Step in a Stage in a GigModuleto be processed where referenced.  When clauses in the
                      referenced Step are ignored.
                    required:
                    - gigModuleRef
                    - stage
                    properties:
                      gigModuleRef: $<GIG_MODULE_REF>
                      name:
                        type: string
                        pattern: $<STAGE_STEP_PATTERN>
                      stage:
                        type: string
                        pattern: $<STAGE_STEP_PATTERN>
                  secretVars:
                    type: array
                    description: |
                      A list of environment variables that should be obfuscated in the logs. Because these variables may
                      be assigned before the log filtering component is aware of the variable, debug logging/tracing will be turned
                      off for this stage if secretVars are defined.  Once declared, the value assigned in this stage
                      will be obfuscated throughout the GigRun. If the value needs to be updated in a subsequent stage,
                      it will need to be redeclared.
                    items:
                      type: string
                    x-kubernetes-list-type: set
                  wait:
                    type: boolean
                  when:
                    type: string
                    description: |
                      Javascript statement that must evaluate to `true` for the step to be processed. For ease of writing expressions,
                      environment variables are copied into the `env` Javascript object; e.g. FOO='some value' in shell can be refered
                      to as `env.FOO` in the statements.
                  interationWhen:
                    type: string
                    description: |
                      Javascript statement that must evaluate to `true` for the step to be processed. For ease of writing expressions,
                      environment variables are copied into the `env` Javascript object; e.g. FOO='some value' in shell can be refered
                      to as `env.FOO` in the statements. Only evaluated if iterate are defined, and evaluated each time just before
                      the step is processed.
                  workDir:
                    type: string
      workDirSizeLimit:
        pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
        x-kubernetes-int-or-string: true
        default: 100Mi

elCicdDefs-$<GIG>:
  TITLE_CASE_NAME: Gig
  SPEC_DEFINITION:
    type: object
    description: $<TITLE_CASE_NAME>Spec defines the relationship between a $<GIG_MODULE> and specific CronJob (i.e. JobTemplate).
    properties:
      cronJobRef:
        type: object
        description: Reference to a CronJob in the same Namespace as the Gig.
        properties:
          name:
            type: string
            description: Name of a CronJob in the same Namespace as the Gig.
        required:
        - name
      gigModuleRef:
        type: object
        description: Reference to a GigModule.
        properties: $<NAME_NAMESPACE_PROPS>
        required:
        - name
      gigFormRef: $<GIG_FORM_REF>
    required:
    - cronJobRef
    - gigModuleRef
  STATUS_DEFINITION:
    type: object
    properties:
      latestGigRun:
        type: object
        properties:
          creationTimestamp:
            type: string
          name:
            type: string
          runState: $<RUN_STATE>
          runTime:
            type: integer
          startedBy:
            type: string

elCicdDefs-$<GIG_RUN>:
  TITLE_CASE_NAME: GigRun
  SPEC_DEFINITION:
    type: object
    description: |
      $<TITLE_CASE_NAME>Spec defines a specific Job run produced from the parent Gig's CronJob.
    properties:
      gigRef:
        type: object
        properties:
          name:
            type: string
            x-kubernetes-validations:
            - rule: "!(self != oldSelf)"
              message: gigRef name and containerName are immutable
          containerName:
            type: string
            x-kubernetes-validations:
            - rule: "!(self != oldSelf)"
              message: gigRef name and containerName are immutable
        required:
        - name
      formTitle: $<TITLE_SPEC>
      inputForm: $<FORM_SPEC>
      inputReceived:
        type: boolean
        default: false
      inputValues:
        type: object
        description: |
          Dictionary of input values to pass to a Pod when starting a GigRun, or to resume execution when paused for further input.
          InputValues are never preserved in a deployed GigRun, but rather used by the Gig Operator to create an associated Secret for
          the Pod to read and use.
        x-kubernetes-preserve-unknown-fields: true
        properties:
          additionalProperties:
            type: string
      runState: $<RUN_STATE>
      startedBy:
        type: string
        description: |
          User or ServiceAccount that created the GigRun.
        x-kubernetes-validations:
        - rule: "size(oldSelf) > 0 && !(self != oldSelf)"
          message: startedBy is immutable
    required:
    - gigRef
  STATUS_DEFINITION:
    type: object
    properties:
      runTime:
        type: integer
        description: |
          Time in seconds it took to complete processing the GigRun.

elCicdTemplates:
- apiVersion: apiextensions.k8s.io/v1
  kind: CustomResourceDefinition
  objNames: $<GIG_TYPES>
  objName: $<>s.batch.ahplos.org
  template:
    spec:
      conversion:
        strategy: None
      group: batch.ahplos.org
      names:
        kind: $<TITLE_CASE_NAME>
        plural: $<BASE_OBJ_NAME>s
        singular: $<BASE_OBJ_NAME>
        shortNames: $<SHORT_NAMES>
      scope: Namespaced
      preserveUnknownFields: false
      versions:
      - name: v1beta1
        served: true
        storage: true
        subresources:
          status: {}
        schema:
          openAPIV3Schema:
            type: object
            properties:
              apiVersion:
                type: string
                description: |-
                  APIVersion defines the versioned module of this representation of an object.
                  Servers should convert recognized schemas to the latest internal value, and
                  may reject unrecognized values.
                  More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
              kind:
                type: string
                description: |-
                  Kind is a string value representing the REST resource this object represents.
                  Servers may infer this from the endpoint the client submits requests to.
                  Cannot be updated.
                  In CamelCase.
                  More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
              metadata:
                type: object
              spec: $<SPEC_DEFINITION>
              status: $<STATUS_DEFINITION>